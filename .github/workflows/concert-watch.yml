name: concert-watch

on:
  schedule:
    - cron: "17 * * * *"     # 매시간(정각 혼잡을 피해 17분). 공연 API는 config의 api_interval_hours마다
  push:
    paths: ["data/picks.json"]   # picks.json을 직접 고치면 바로 리마인더를 예약
  issues:
    types: [opened]              # 웹페이지의 '예매할게요'가 연 이슈를 picks.json에 반영
  workflow_dispatch:
    inputs:
      test_notify:
        description: "예시 공연으로 알림만 점검하기"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: concert-watch
  cancel-in-progress: false

jobs:
  watch:
    # 이슈는 저장소 주인이 연 예매 계획 이슈만 처리(다른 사람이 연 이슈는 무시)
    if: >-
      github.event_name != 'issues' ||
      (github.event.issue.user.login == github.repository_owner &&
       contains(github.event.issue.body, '<!-- concert-watch-pick -->'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
      SMS_FROM: ${{ secrets.SMS_FROM }}
      NOTIFY_SMS_TO: ${{ secrets.NOTIFY_SMS_TO }}
      SOLAPI_API_KEY: ${{ secrets.SOLAPI_API_KEY }}
      SOLAPI_API_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_GRAPH_VERSION: ${{ secrets.IG_GRAPH_VERSION }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 알림 점검
        if: ${{ inputs.test_notify }}
        run: python watch.py --test-notify

      - name: 예매 리마인더만 처리
        if: ${{ github.event_name == 'push' }}
        run: python watch.py --reminders-only

      - name: 예매 계획 이슈 반영
        id: pick
        if: ${{ github.event_name == 'issues' }}
        run: python watch.py --apply-issue "$GITHUB_EVENT_PATH"

      - name: 공연 확인
        if: ${{ github.event_name != 'push' && github.event_name != 'issues' && !inputs.test_notify }}
        run: python watch.py

      - name: 결과 저장
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name "concert-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json data/picks.json docs 2>/dev/null || git add data/state.json docs
          git diff --cached --quiet && exit 0
          if [ "${{ github.event_name }}" = "issues" ]; then git commit -m "예매 계획 반영 (#${{ github.event.issue.number }})"
          else git commit -m "공연 일정 갱신"; fi
          # 그 사이 웹페이지에서 예매 계획이 저장됐을 수 있으니 합친 뒤 올린다
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1

      - name: 이슈 닫기
        if: ${{ always() && github.event_name == 'issues' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.pick.outputs.result }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            gh issue close "${{ github.event.issue.number }}" -R "$GITHUB_REPOSITORY" --comment "✅ ${RESULT}"
          else
            gh issue comment "${{ github.event.issue.number }}" -R "$GITHUB_REPOSITORY" --body "⚠️ ${RESULT:-저장하지 못했어요.} Actions 로그를 확인하세요."
          fi
