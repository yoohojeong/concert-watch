name: concert-watch

on:
  schedule:
    - cron: "*/5 * * * *"    # 5분마다: 웹페이지 변경은 바로 반영, 공연 확인은 1시간마다(watch.py --auto)
  push:
    paths: ["data/picks.json"]   # picks.json을 직접 고치면 바로 리마인더를 예약
  workflow_dispatch:
    inputs:
      test_notify:
        description: "예시 공연으로 알림만 점검하기"
        type: boolean
        default: false
      force_api:
        description: "공연 API(KOPIS·Ticketmaster)를 지금 바로 확인하기"
        type: boolean
        default: false
      chain:
        description: "5분 주기 이어달리기(보통은 자동으로 켜져요)"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write       # 다음 실행을 스스로 시작하려고(5분 주기 이어달리기)

jobs:
  watch:
    runs-on: ubuntu-latest
    # 실행은 하나씩만(대기 중인 실행은 하나만 남는다)
    concurrency:
      group: concert-watch
      cancel-in-progress: false
    timeout-minutes: 20
    env:
      KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
      TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
      SMS_FROM: ${{ secrets.SMS_FROM }}
      NOTIFY_SMS_TO: ${{ secrets.NOTIFY_SMS_TO }}
      SOLAPI_API_KEY: ${{ secrets.SOLAPI_API_KEY }}
      SOLAPI_API_SECRET: ${{ secrets.SOLAPI_API_SECRET }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
      NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      IG_GRAPH_VERSION: ${{ secrets.IG_GRAPH_VERSION }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PICK_PASSPHRASE: ${{ secrets.PICK_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}   # 앞선 실행이 올린 커밋까지 받은 최신 상태에서 시작
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: 알림 점검
        if: ${{ inputs.test_notify }}
        run: python watch.py --test-notify

      - name: 예매 리마인더만 처리
        if: ${{ github.event_name == 'push' }}
        run: python watch.py --reminders-only

      - name: 공연 확인
        if: ${{ github.event_name != 'push' && !inputs.test_notify }}
        run: python watch.py ${{ (github.event_name == 'schedule' || inputs.chain) && '--auto' || '' }} ${{ inputs.force_api && '--force-api' || '' }}

      - name: 결과 저장
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name "concert-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json docs; for f in data/picks.json data/artists.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -m "공연 일정 갱신"
          # 그 사이 다른 실행이 올린 커밋과 합친다. 생성 파일이 겹치면 이번 실행 결과를 쓴다
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; git rebase --abort 2>/dev/null; sleep 5; done
          exit 1

      # GitHub의 정기 실행(schedule)이 새 저장소에서 안 돌거나 밀리는 일이 있어서,
      # 실행이 끝나기 전에 약 5분 뒤 다음 실행을 직접 시작한다.
      # 실행이 겹치면 concurrency 설정 때문에 대기 중인 것 하나만 남아서 이어달리기가 여러 줄로 늘어나지 않는다.
      - name: 5분 뒤 다음 실행 시작
        # 어떤 이유로 시작된 실행이든 다음 실행을 이어 준다(대기 중인 실행은 하나만 남으니 늘어나지 않음)
        if: ${{ always() && !inputs.test_notify }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 240
          gh workflow run concert-watch.yml -R "$GITHUB_REPOSITORY" -f chain=true
